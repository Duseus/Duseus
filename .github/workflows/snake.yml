name: Generate Snake
on:
  schedule:
    - cron: "23 1 * * *"
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate Snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: Duseus
          outputs: |
            dist/snake-dark.svg?palette=github-dark&color_snake=#58a6ff&color_dots=#123055,#1F4E79,#2E6DA4,#5AA8E0,#58a6ff
            dist/snake-light.svg?palette=github-light&color_snake=#1F4E79&color_dots=#E0E7EF,#B9C9DA,#7FA8CC,#4A7BA6,#1F4E79

      - name: Deploy Snake to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
          keep_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
